<!doctype html>
<html><head><meta charset="utf-8">
<!-- The site's link preview image (og.jpg, 1200 x 630): render with
     Chrome --headless --window-size=1200,630 --screenshot (see README). -->
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=block" rel="stylesheet">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
.og { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: 'Comic Neue', sans-serif; color: #181412;
  background: radial-gradient(circle, #b0161e 5px, transparent 6px) 0 0/22px 22px, #d6242a; }
.left { position: absolute; left: 56px; top: 54px; width: 560px; }
.tag { display: inline-block; font: 26px Bangers, Impact, sans-serif; letter-spacing: .05em; background: #fffbf0; border: 4px solid #181412;
  box-shadow: 5px 5px 0 #181412; padding: 4px 16px; transform: rotate(-2deg); }
h1 { font: 128px/0.86 Bangers, Impact, sans-serif; letter-spacing: .03em; margin: 22px 0 22px; color: #ffd426;
  text-shadow: -6px -6px 0 #181412, 6px -6px 0 #181412, -6px 6px 0 #181412, 6px 6px 0 #181412, 0 6px 0 #181412, 0 -6px 0 #181412, 6px 0 0 #181412, -6px 0 0 #181412, 12px 12px 0 #181412; }
h1 span { color: #fffbf0; }
.lead { font-size: 27px; font-weight: 700; line-height: 1.3; background: #fffbf0; border: 4px solid #181412; box-shadow: 7px 7px 0 #181412; padding: 14px 20px; }
.chips { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; }
.chip { font: 24px Bangers, Impact, sans-serif; letter-spacing: .05em; background: #ffd426; border: 3px solid #181412; box-shadow: 4px 4px 0 #181412; padding: 4px 12px; }
.shot { position: absolute; border: 5px solid #181412; box-shadow: 9px 9px 0 #181412; background: #181412; display: block; }
.play { right: 300px; top: 40px; width: 268px; transform: rotate(-3deg); }
.glass { right: 36px; top: 70px; width: 300px; transform: rotate(2deg); }
.dmd { right: 70px; top: 270px; width: 290px; transform: rotate(-2deg); }
.burst { position: absolute; right: 30px; bottom: 22px; width: 206px; height: 206px; }
.burst svg { width: 100%; height: 100%; overflow: visible; }
.burst .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  font: 30px/0.95 Bangers, Impact, sans-serif; letter-spacing: .04em; color: #d6242a; transform: rotate(-8deg); }
</style></head><body>
<div class="og">
  <div class="left">
    <span class="tag">For AtGames Legends pinball</span>
    <h1>Comic<br><span>Reader!</span></h1>
    <div class="lead">Comics and manuals on your cabinet: pages on the playfield, the cover on the backglass, the page on the DMD.</div>
    <div class="chips"><span class="chip">PDF</span><span class="chip">CBZ</span><span class="chip">CBR</span><span class="chip">WebP</span><span class="chip">Free!</span></div>
  </div>
  <img class="shot play" src="images/library.jpg">
  <img class="shot glass" src="images/reader-backglass.jpg">
  <img class="shot dmd" src="images/reader-dmd.jpg">
  <div class="burst">
    <svg viewBox="-125 -125 250 250" id="b"></svg>
    <div class="t">Zoom!<br>Curl!<br>Attract!</div>
  </div>
</div>
<script>
  const pts = (o, i, n, r) => { const p = []; for (let k = 0; k < n * 2; k++) { const j = k % 2 ? 1 : (k % 4 ? .9 : 1);
    const rad = (k % 2 ? i : o) * j, a = k / (n * 2) * Math.PI * 2 + r; p.push((rad * Math.cos(a)).toFixed(1) + ',' + (rad * Math.sin(a)).toFixed(1)); } return p.join(' '); };
  document.getElementById('b').innerHTML =
    `<polygon points="${pts(122, 84, 16, .1)}" fill="#181412" transform="translate(8 8)"/>` +
    `<polygon points="${pts(122, 84, 16, .1)}" fill="#ffd426" stroke="#181412" stroke-width="6" stroke-linejoin="round"/>`;
</script>
</body></html>
