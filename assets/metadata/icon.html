<!doctype html>
<html><head><meta charset="utf-8">
<!-- The app's menu art (comic-reader.png, 1024 x 1536), rendered with
     tools/make-icon.sh. Open book: Material Symbols "auto_stories" (Apache-2.0).
     Lettering: Bangers (OFL). -->
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,600,1,0&display=block" rel="stylesheet">
<style>
html, body { margin: 0; width: 1024px; height: 1536px; overflow: hidden; }
.art { position: relative; width: 1024px; height: 1536px; overflow: hidden;
  background: radial-gradient(circle, #e2cca0 7px, transparent 8.5px) 0 0/36px 36px, #f4e8c8; }
/* Big halftone tint in two corners. */
.tint { position: absolute; inset: 0;
  background: radial-gradient(circle, #d6242a 9px, transparent 10.5px) 0 0/30px 30px;
  -webkit-mask-image: radial-gradient(900px 700px at 0% 0%, #000 0%, transparent 60%), radial-gradient(900px 800px at 100% 100%, #000 0%, transparent 60%);
  opacity: .35; }
.burst { position: absolute; left: 512px; top: 640px; }
.burst svg { position: absolute; left: -500px; top: -500px; width: 1000px; height: 1000px; overflow: visible; }
.bubble { position: absolute; left: 172px; top: 360px; width: 680px; height: 540px; }
.bubble svg { position: absolute; inset: 0; overflow: visible; }
.book { position: absolute; left: 0; right: 0; top: 88px; text-align: center; font-family: 'Material Symbols Rounded';
  font-size: 320px; line-height: 1; color: #181412; font-variation-settings: 'FILL' 1, 'wght' 600, 'opsz' 48; }
.title { position: absolute; left: 0; right: 0; top: 1010px; text-align: center; font-family: Bangers, Impact, sans-serif; letter-spacing: 6px; }
.title div { line-height: .9; }
.a { font-size: 270px; color: #ffd426;
  text-shadow: -9px -9px 0 #181412, 9px -9px 0 #181412, -9px 9px 0 #181412, 9px 9px 0 #181412, 0 9px 0 #181412, 0 -9px 0 #181412, 9px 0 0 #181412, -9px 0 0 #181412, 20px 20px 0 #181412; }
.b { font-size: 210px; color: #fffbf0; margin-top: 10px;
  text-shadow: -8px -8px 0 #181412, 8px -8px 0 #181412, -8px 8px 0 #181412, 8px 8px 0 #181412, 0 8px 0 #181412, 0 -8px 0 #181412, 8px 0 0 #181412, -8px 0 0 #181412, 18px 18px 0 #d6242a; }
</style></head><body>
<div class="art">
  <div class="tint"></div>
  <div class="burst"><svg viewBox="-500 -500 1000 1000" id="star"></svg></div>
  <div class="bubble">
    <svg viewBox="0 0 680 540">
      <path d="M340 26 C540 26 656 124 656 246 C656 368 540 456 362 462 L230 530 L258 452 C118 428 24 346 24 246 C24 124 140 26 340 26 Z"
            fill="#181412" transform="translate(16 16)"/>
      <path d="M340 26 C540 26 656 124 656 246 C656 368 540 456 362 462 L230 530 L258 452 C118 428 24 346 24 246 C24 124 140 26 340 26 Z"
            fill="#fffbf0" stroke="#181412" stroke-width="14" stroke-linejoin="round"/>
    </svg>
    <div class="book">auto_stories</div>
  </div>
  <div class="title"><div class="a">COMIC</div><div class="b">READER!</div></div>
</div>
<script>
  // The starburst: uneven spikes, black outline and shadow, yellow, red inside.
  const pts = (outer, inner, n, rot) => {
    const p = [];
    for (let i = 0; i < n * 2; i++) {
      const j = i % 2 ? (i % 6 === 1 ? .95 : 1) : (i % 4 === 0 ? 1 : .88);
      const r = (i % 2 ? inner : outer) * j, a = i / (n * 2) * Math.PI * 2 + rot;
      p.push((r * Math.cos(a)).toFixed(1) + ',' + (r * Math.sin(a)).toFixed(1));
    }
    return p.join(' ');
  };
  const s = document.getElementById('star');
  s.innerHTML =
    `<polygon points="${pts(490, 330, 18, .05)}" fill="#181412" transform="translate(18 18)"/>` +
    `<polygon points="${pts(490, 330, 18, .05)}" fill="#ffd426" stroke="#181412" stroke-width="12" stroke-linejoin="round"/>` +
    `<polygon points="${pts(380, 262, 18, .14)}" fill="#d6242a" stroke="#181412" stroke-width="8" stroke-linejoin="round"/>`;
</script>
</body></html>
